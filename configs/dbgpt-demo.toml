# =============================================================
# DB-GPT DEMO CONFIG
# AI destekli veritabani sorgulama ve analiz sistemi - demo
# =============================================================
# Calistirma:
#   uv run dbgpt start webserver --config configs/dbgpt-demo.toml
#
# Tum gizli degerler (.env.demo dosyasindan) ${env:...} ile okunur.
# LLM saglayicisini degistirmek icin asagidaki [models] bolumune bak.
# =============================================================

[system]
# Arayuz dili: "tr", "en" veya "zh"
language = "${env:DBGPT_LANG:-tr}"
log_level = "INFO"
api_keys = []
encrypt_key = "${env:DBGPT_ENCRYPT_KEY:-demo_secret_key_degistir}"

# -------------------------------------------------------------
# Web sunucusu - http://localhost:5670
# -------------------------------------------------------------
[service.web]
host = "0.0.0.0"
port = 5670

# -------------------------------------------------------------
# Metadata DB (DB-GPT'nin kendi sistem verisi)
# SQLite = kurulum gerektirmez, demo icin yeterli.
# -------------------------------------------------------------
[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"

[service.model.worker]
host = "127.0.0.1"

# -------------------------------------------------------------
# Vektor / RAG depolama
# -------------------------------------------------------------
[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

# -------------------------------------------------------------
# Uygulama davranisi
# -------------------------------------------------------------
[app]
temperature = 0.6

[[app.configs]]
name = "chat_with_db_qa"
schema_retrieve_top_k = 50
memory = {type = "token", max_token_limit = 20000}

[[app.configs]]
name = "chat_normal"
memory = {type = "token", max_token_limit = 20000}

# =============================================================
# MODEL YAPILANDIRMASI
# Varsayilan: OpenAI. Saglayiciyi degistirmek istersen:
#   1) Asagidaki OpenAI blogunu yorum satiri yap,
#   2) Istedigin saglayici blogunun yorumunu kaldir,
#   3) .env.demo icindeki ilgili API anahtarini doldur.
# =============================================================
[models]

# ---- Google Gemini (VARSAYILAN - OpenAI uyumlu endpoint uzerinden) ----
# Tek GEMINI_API_KEY ile hem LLM hem embedding calisir.
# Ucretsiz anahtar: https://aistudio.google.com/apikey
[[models.llms]]
name = "${env:LLM_MODEL_NAME:-gemini-2.5-flash}"
provider = "proxy/openai"
api_base = "${env:GEMINI_API_BASE:-https://generativelanguage.googleapis.com/v1beta/openai/}"
api_key = "${env:GEMINI_API_KEY}"

[[models.embeddings]]
name = "${env:EMBEDDING_MODEL_NAME:-gemini-embedding-001}"
provider = "proxy/openai"
api_url = "${env:GEMINI_EMBEDDING_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai/embeddings}"
api_key = "${env:GEMINI_API_KEY}"

